version: "3.7"

services:
  dev:
    restart: always
    build: ./services/dev
    image: dev
    container_name: dev
    volumes:
      - ./src/:/home/vscode/src
      - ./terraform/:/home/vscode/terraform
      - ./minio_data:/data
      - ./.vscode/:/home/vscode/.vscode
      - ./minio_data:${PREFECT_HOME}
    working_dir: /home/vscode/src
    env_file:
      - .env
      - .dev.env
      # ports: "${DEV_PORT}:${DEV_PORT}"
    networks:
      - frontend
      - backend
    tty: true
    profiles:
      - dev
      - all

  model-server:
    restart: always
    build: ./services/model-server
    image: model-server
    container_name: model-server
    working_dir: /home/vscode/app
    ports:
      - "9696:9696"
    env_file:
      # - .env
      - .dev.env
    networks:
      - frontend
      - backend
    tty: true
    # entrypoint: [ "gunicorn", "--bind=0.0.0.0:9696", "predict:app" ]
    profiles:
      - serve
      - all

  prefect-server:
    image: prefecthq/prefect:2.11.3-python3.11
    restart: always
    container_name: prefect-server
    volumes:
      - ./minio_data:${PREFECT_HOME}
    entrypoint:
      [
        "/opt/prefect/entrypoint.sh",
        "prefect",
        "server",
        "start"
      ]
    env_file:
      - .env
    ports:
      - ${PREFECT_PORT}:${PREFECT_PORT}
    networks:
      - frontend
      - backend
    profiles:
      - prefect
      - all

  prefect-agent:
    image: prefecthq/prefect:2.11.3-python3.11
    container_name: mlflow-agent
    restart: always
    entrypoint:
      [
        "/opt/prefect/entrypoint.sh",
        "prefect",
        "agent",
        "start",
        "-q",
        "default"
      ]
    env_file:
      - .dev.env
    # env:
    #   - PREFECT_ORION_API_HOST=prefect-server
    #   - PREFECT_PORT='4200'
    #   - PREFECT_UI_URL=http://prefect-server:4200/api
    #   - PREFECT_API_URL=http://prefect-server:4200/api
    # PREFECT_UI_URL=http://prefect-server:4200/api
    # PREFECT_API_URL=http://prefect-server:4200/api
    networks:
      - backend
      - frontend
    profiles:
      - prefect
      - all

  s3:
    restart: always
    image: minio/minio
    container_name: s3
    volumes:
      - ./minio_data:/data
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    networks:
      - frontend
      - backend
    env_file:
      - .env
    command: server /data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live"
        ]
      interval: 5s
      timeout: 5s
      retries: 3
    profiles:
      - prefect
      - mlflow
      - all

  mlflow-server:
    restart: always
    build: ./services/mlflow
    image: mlflow_server
    container_name: mlflow-server
    depends_on:
      - s3
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - frontend
      - backend
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=http://s3:${MINIO_PORT}
      - MLFLOW_TRACKING_URI=sqlite:////data/mlflow.db
      - MLFLOW_S3_IGNORE_TLS=true
    # volumes:
    #   - ./minio_data:/data
    command: |
      mlflow server 
        --backend-store-uri "${MLFLOW_TRACKING_URI}"  
        --host 0.0.0.0 --serve-artifacts 
        --artifacts-destination s3://${MLFLOW_BUCKET_NAME}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://mlflow-server:5000/" ]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - mlflow
      - all

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
